[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "xio"
version = "0.1.0"
description = "Python bindings for rocm-xio SDMA endpoint (host-side)"
requires-python = ">=3.9"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["xio"]
